name: Publish Docker image

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`,
# or publishing a GitHub Release with a new tag through the web UI) — not on
# every push to main, since customers deploying this image want a stable,
# predictable version to pin to, not whatever the latest commit happens to
# be. workflow_dispatch is a second, manual way in: a "Run workflow" button
# in the Actions tab, useful for testing without committing to a real tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the image tag (e.g. 0.1.0, no leading v)"
        required: true
        type: string

permissions:
  contents: read
  packages: write # required for GITHUB_TOKEN to push to GHCR — not granted by default
  id-token: write # required for cosign's keyless signing (Sigstore Fulcio)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # No QEMU step here on purpose: Cloud Run only runs linux/amd64
      # containers, so building an arm64 image would just slow down every
      # publish for a platform this tool never runs on.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        env:
          # Passed as an environment variable, not expanded into the
          # script. A ${{ }} expansion is pasted in as text before the
          # shell runs, so an input containing shell characters would run
          # as commands on the runner.
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Accept only a plain version number. The test covers the whole
          # value, so a newline cannot smuggle in a second output key.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a valid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/aizkaban:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aizkaban:latest

      # Signs the published digest with a short-lived, keyless certificate.
      # Anyone can then run `cosign verify` against the image to confirm it
      # came from this workflow and was not modified after publishing. The
      # transparency log entry this writes to is only meaningful for a
      # public GHCR package; pass --force to sign a private one too.
      - name: Sign the published image
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/aizkaban@${DIGEST}"
